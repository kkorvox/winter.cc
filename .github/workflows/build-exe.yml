name: Build winter.cc native Windows EXE (review before release)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Only publish after reviewing the build and security scans'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'desktop/Program.cs'
      - 'desktop/WinterCC.csproj'
      - '.github/workflows/build-exe.yml'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build transparent WinForms WebView2 app
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows EXE
        shell: pwsh
        run: |
          dotnet publish desktop/WinterCC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o dist
          if (!(Test-Path 'dist/WinterCC.exe')) { throw 'Windows EXE build failed' }
          Copy-Item 'dist/WinterCC.exe' 'dist/wintercc.exe' -Force
          Get-FileHash 'dist/wintercc.exe' -Algorithm SHA256 | Format-List
      - name: Upload EXE for testing and security review
        uses: actions/upload-artifact@v4
        with:
          name: wintercc-windows-v7.8-review
          path: dist/wintercc.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified build to GitHub Releases
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.8
          name: winter.cc Desktop v7.8
          body: |
            Native WinForms app embedding Microsoft's official WebView2 SDK.
            Displays the live winter.cc website. Requires Internet and the
            Microsoft Edge WebView2 Runtime.
            Developer is responsible for scanning and verifying the binary.
            This build is unsigned, so Windows may show an unknown publisher warning.
          files: dist/wintercc.exe
          make_latest: true
          overwrite_files: true
